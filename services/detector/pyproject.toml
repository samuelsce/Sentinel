[project]
name = "sentinel-detector"
version = "0.1.0"
description = "Sentinel private durable detector and portable event validation"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema[format]>=4.25,<5", "psycopg[binary]>=3.2,<4"]

[project.scripts]
sentinel-detector = "sentinel_detector.worker:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
